# Omarchy server profile. Every person on the server has one profile; it sets
# what they get and what they may do. Edit with: omarchy server profile edit <name>
# Changes apply to everyone on the profile with: omarchy server profile apply <name>

# Packages installed on the server for people on this profile, from the
# configured package repositories (Arch and Omarchy).
APPS=()

# Only show these apps in the launcher (desktop file names without .desktop,
# like chromium or org.gnome.Nautilus). Empty shows every installed app.
# This tidies the launcher; it is not a security boundary.
LAUNCHER_ONLY=()

# Web apps placed in each person's launcher, as "Name|URL|icon URL or name".
WEBAPPS=(
  # "HEY|https://app.hey.com|https://app.hey.com/favicon.png"
)

# Theme and background for new people on this profile. Theme names are the
# folders in /usr/share/omarchy/themes or ~/.config/omarchy/themes. BACKGROUND
# is an image path on the server, such as one in /etc/omarchy-server/backgrounds.
THEME=""
BACKGROUND=""
# 1 keeps people from changing the theme; it is set again at each sign-in.
THEME_LOCKED=0

# Fair share of the server. CPU_WEIGHT is relative (100 is everyone's default).
# MEMORY_MAX caps a person's memory, as bytes with K/M/G/T or a % of the server.
CPU_WEIGHT=100
MEMORY_MAX=""

# Internet and network access from people's apps.
#   allow - everything, except what NETWORK_DENY lists
#   deny  - nothing, except what NETWORK_ALLOW lists (DNS is always allowed)
# Entries: "tcp:443", "udp:123", "tcp:8000-8100", an address or network
# ("10.0.0.0/8", "fd00::/8"), or both ("tcp:22@10.0.0.5").
NETWORK=allow
NETWORK_ALLOW=()
NETWORK_DENY=()
