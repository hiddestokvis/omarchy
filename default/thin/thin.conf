# Omarchy thin client device settings, written by omarchy-thin-install.
# Lives in /etc/omarchy-thin; changes apply at the next sign-in.

# The Omarchy server and its SSH port.
OMARCHY_THIN_SERVER=""
OMARCHY_THIN_PORT=22

# Speakers and microphone, as Opus streams over the server connection
# (~100 kbit/s, near silent when idle). off turns audio off.
OMARCHY_THIN_AUDIO=opus
OMARCHY_THIN_SPEAKER_BITRATE=96000
OMARCHY_THIN_MIC_BITRATE=32000

# Camera, shared with Super + Ctrl + Alt + V or omarchy-thin-camera.
OMARCHY_THIN_CAMERA_DEVICE=/dev/video0
OMARCHY_THIN_CAMERA_SIZE=1280x720
OMARCHY_THIN_CAMERA_FPS=30
OMARCHY_THIN_CAMERA_BITRATE=1500k
# auto picks the hardware H.264 encoder on ARM boards that have one, else x264.
# copy passes the camera's own MJPEG through: no CPU, more bandwidth. Use it on
# machines too slow to encode video, like a 2010 iMac.
OMARCHY_THIN_CAMERA_ENCODER=auto

# Commands to run on this device rather than on the server, on top of
# terminals, Omarchy's own commands and the hardware tools.
OMARCHY_THIN_LOCAL_APPS=()
# Omarchy commands to run on the server instead of here.
OMARCHY_THIN_REMOTE_APPS=()
