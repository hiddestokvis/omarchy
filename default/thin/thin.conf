# Omarchy thin client settings. Sourced by the omarchy-thin-* commands.
# Changes take effect after: systemctl --user restart omarchy-thin

# The Omarchy server to log in to (user@host) and its SSH port.
OMARCHY_THIN_SERVER=""
OMARCHY_THIN_PORT=22

# Your runtime directory on the server. Filled in by omarchy-thin-setup and only
# used when OMARCHY_THIN_AUDIO=pulse.
OMARCHY_THIN_REMOTE_RUNTIME=""

# How waypipe compresses window updates: none, lz4[=level] or zstd[=level].
# zstd uses the least bandwidth; lz4 uses the least CPU on slow devices.
OMARCHY_THIN_COMPRESS="zstd=7"

# 1 lets waypipe hand GPU buffers across (both machines need working GPUs).
# 0 keeps every app on shared-memory buffers, which works everywhere.
OMARCHY_THIN_GPU=0

# Audio between this device and the server:
#   opus  - speakers and microphone as Opus streams (~100 kbit/s, near silent when idle)
#   pulse - raw PulseAudio over the SSH connection (lowest latency, ~1.5 Mbit/s)
#   off   - no audio
OMARCHY_THIN_AUDIO=opus
OMARCHY_THIN_SPEAKER_BITRATE=96000
OMARCHY_THIN_MIC_BITRATE=32000

# Camera forwarding (toggle with omarchy-thin-camera or Super + Ctrl + Alt + V).
OMARCHY_THIN_CAMERA_DEVICE=/dev/video0
OMARCHY_THIN_CAMERA_SIZE=1280x720
OMARCHY_THIN_CAMERA_FPS=30
OMARCHY_THIN_CAMERA_BITRATE=1500k
# auto picks the hardware H.264 encoder on ARM boards that have one, else x264.
# Set to copy to pass the camera's own MJPEG through untouched (no CPU, more bandwidth).
OMARCHY_THIN_CAMERA_ENCODER=auto

# Commands that should run on this device rather than on the server, on top of
# terminals, Omarchy's own commands and the hardware tools (Wi-Fi, Bluetooth, audio).
OMARCHY_THIN_LOCAL_APPS=()
# Omarchy commands that should run on the server instead of here.
OMARCHY_THIN_REMOTE_APPS=()

# 1 keeps new terminals on this device instead of opening a shell on the server.
OMARCHY_THIN_LOCAL_SHELL=0
